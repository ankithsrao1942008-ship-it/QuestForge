<!DOCTYPE html>
<html>
    <title>QuestForge</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>



    <h1>QuestForge</h1>


    <p>Turn your life into an RPG</p>
    <div class="player-card">
        <h2>⚔️ Ankith</h2>
        <p id="level">Level 1 Adventurer</p>
        <h3>XP</h3>
        <div class="xp-bar">
            <div id="xp-progress" class="xp-progress"></div>
        </div>
        <p id="xp-text">120 / 500 XP</p>
        <p id="coins">💰 100Coins</p>
    </div>    
    
    <div class="quest-board">
        <h2>⚔️ Quest Board</h2>

        <div class="quest">
            <h3>📚 Study for 30 minutes</h3>

            <p>Difficulty: ⭐⭐</p>

            <p>Reward: +100 XP &nbsp; +50 Coins</p>
            <button id="complete-quest">Complete Quest</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
